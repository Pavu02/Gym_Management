<nav class="navbar">
  <div class="nav-brand">
    <a routerLink="/home" class="logo">Gym<span>Pro</span></a>
  </div>

  <div class="nav-links">
    <!-- Public Links (Not Logged In) -->
    <ng-container *ngIf="!isLoggedIn()">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/signup" routerLinkActive="active" class="btn-highlight">Sign Up</a>
    </ng-container>

    <!-- ADMIN Links -->
    <ng-container *ngIf="isLoggedIn() && getRole() === 'ADMIN'">
      <a routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/admin/plans" routerLinkActive="active">Plans</a>
      <a routerLink="/admin/members" routerLinkActive="active">Members</a>
      <a routerLink="/admin/trainers" routerLinkActive="active">Trainers</a>
      <a routerLink="/admin/payments" routerLinkActive="active">Payments</a>
      <a routerLink="/admin/attendance" routerLinkActive="active">Attendance</a>
    </ng-container>

    <!-- MEMBER Links -->
    <ng-container *ngIf="isLoggedIn() && getRole() === 'MEMBER'">
      <a routerLink="/member/profile" routerLinkActive="active">Profile</a>
      <a routerLink="/member/plan" routerLinkActive="active">My Plan</a>
      <a routerLink="/member/attendance" routerLinkActive="active">Attendance</a>
      <a routerLink="/member/payments" routerLinkActive="active">Payments</a>
    </ng-container>

    <!-- TRAINER Links -->
    <ng-container *ngIf="isLoggedIn() && getRole() === 'TRAINER'">
      <a routerLink="/trainer/members" routerLinkActive="active">My Members</a>
    </ng-container>

    <!-- Logout / User tag -->
    <ng-container *ngIf="isLoggedIn()">
      <span class="user-badge">{{ getName() }} ({{ getRole() }})</span>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </ng-container>
  </div>
</nav>
