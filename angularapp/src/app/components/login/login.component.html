<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-sub">BEAST<span class="text-orange">X</span> PERFORMANCE</div>
      <h2>WELCOME <span class="text-orange">BACK</span></h2>
      <p>Log in to access your personal dashboard</p>
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">EMAIL ADDRESS</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="ENTER YOUR EMAIL"
          class="form-input-line"
          [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <div class="error-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
          Email is required
        </div>
        <div class="error-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
          Please enter a valid email address
        </div>
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="ENTER YOUR PASSWORD"
          class="form-input-line"
          [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <div class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
          Password is required
        </div>
      </div>

      <button type="submit" class="btn-bracket" style="width: 100%; margin-top: 10px;" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

      <p class="auth-footer">
        Don't have an account? <a routerLink="/signup" class="text-orange">Sign up here</a>
      </p>
    </form>
  </div>
</div>
