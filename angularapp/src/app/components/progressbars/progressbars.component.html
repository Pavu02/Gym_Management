<div class="pb-wrap" [class.is-in-view]="inView">
  <div *ngIf="!bars.length" class="pb-empty">No data yet</div>
  <div class="pb-list" *ngIf="bars.length">
    <div class="pb-row" *ngFor="let b of bars; let i = index">
      <div class="pb-name-row">
        <span class="pb-name">{{ b.name }}</span>
        <span class="pb-meta">
          <span class="pb-count" [class.red]="b.overloaded">{{ b.members }} / {{ b.max }}</span>
          <span class="pb-pct" [class.red]="b.overloaded">{{ b.pct }}%</span>
        </span>
      </div>
      <svg viewBox="0 0 320 10" preserveAspectRatio="none" class="pb-svg">
        <defs>
          <linearGradient [id]="'pb-grad-' + i" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" [attr.stop-color]="b.overloaded ? '#EF4444' : '#FF5A00'"/>
            <stop offset="100%" [attr.stop-color]="b.overloaded ? '#F87171' : '#FF8A1F'"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="320" height="10" rx="5" fill="#252525"/>
        <rect x="0" y="0" [attr.width]="b.barW" height="10" rx="5"
              [attr.fill]="'url(#pb-grad-' + i + ')'"
              class="pb-fill-rect"
              [style.animation-delay]="(i * 90) + 'ms'"/>
      </svg>
    </div>
  </div>
</div>
