<div class="form-page-container">
  <div class="form-card">
    <div class="form-header">
      <h2>{{ isEditMode ? 'Edit' : 'Add New' }} <span>Plan</span></h2>
      <p>{{ isEditMode ? 'Update membership plan details' : 'Create a new gym membership plan' }}</p>
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="planForm" (ngSubmit)="onSubmit()" class="form-body">
      <div class="form-group">
        <label for="name">Plan Name</label>
        <input type="text" id="name" formControlName="name" placeholder="e.g. Gold Yearly, Silver Monthly"
          [class.is-invalid]="planForm.get('name')?.touched && planForm.get('name')?.invalid" />
        <div class="error-text" *ngIf="planForm.get('name')?.touched && planForm.get('name')?.errors?.['required']">
          Plan name is required
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label for="durationMonths">Duration (Months)</label>
          <input type="number" id="durationMonths" formControlName="durationMonths" min="1"
            [class.is-invalid]="planForm.get('durationMonths')?.touched && planForm.get('durationMonths')?.invalid" />
          <div class="error-text"
            *ngIf="planForm.get('durationMonths')?.touched && planForm.get('durationMonths')?.errors?.['min']">
            Duration must be at least 1 month
          </div>
        </div>

        <div class="form-group col">
          <label for="price">Price (₹)</label>
          <input type="number" id="price" formControlName="price" min="1" step="0.01"
            [class.is-invalid]="planForm.get('price')?.touched && planForm.get('price')?.invalid" />
          <div class="error-text" *ngIf="planForm.get('price')?.touched && planForm.get('price')?.errors?.['min']">
            Price must be greater than 0
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="3"
          placeholder="Detailed plan benefits, access privileges..."
          [class.is-invalid]="planForm.get('description')?.touched && planForm.get('description')?.invalid"></textarea>
        <div class="error-text"
          *ngIf="planForm.get('description')?.touched && planForm.get('description')?.errors?.['required']">
          Description is required
        </div>
      </div>

      <div class="form-group">
        <label for="features">Plan Features (comma-separated)</label>
        <input type="text" id="features" formControlName="features"
          placeholder="e.g. Gym Access, Locker Room, Free WiFi, Diet Consultation" class="form-input" />
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="popular">
          <span>Highlight as <strong>"Most Popular"</strong> Plan</span>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-save" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEditMode ? 'Update Plan' : 'Save Plan') }}
        </button>
        <a routerLink="/admin/plans" class="btn btn-cancel">Cancel</a>
      </div>
    </form>
  </div>
</div>
