# Load secrets from a separate file that Git ignores
spring.config.import=optional:classpath:application-secrets.properties

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/gym_db?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.expiration=86400000

# Google Sheets automation
automation.sheets.enabled=true
automation.sheets.credentials-file=google-credentials.json

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WebAuthn / Passkey
webauthn.rp.id=localhost
webauthn.rp.name=GymPro
webauthn.origin=http://localhost:8081
webauthn.rp-id=localhost
webauthn.rp-name=GymPro
webauthn.origins=http://localhost:8081
checkin.kiosk.token-seconds=60
checkin.fingerprint.simulator-enabled=false

# Automation & App Settings
automation.brand-name=BeastX Gym
automation.reminder.days-before=2
automation.reminder.cron=0 0 9 * * *
automation.report.cron=0 0 8 * * *
automation.sheets.resync-cron=0 0 23 * * *
app.timezone=Asia/Kolkata

