# Load secrets from a separate file that Git ignores locally
spring.config.import=optional:classpath:application-secrets.properties

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gym_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET:GymManagementSecretKeyForJwtTokenGeneration2026SecureKey}
jwt.expiration=86400000

# Frontend & CORS
app.frontend-url=${FRONTEND_URL:http://localhost:8081}
app.backend-url=${BACKEND_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081,http://127.0.0.1:4200,http://127.0.0.1:8081}

# WebAuthn / Passkey
webauthn.rp.id=${WEBAUTHN_RP_ID:localhost}
webauthn.rp.name=BeastX Gym
webauthn.origin=${WEBAUTHN_ORIGINS:http://localhost:4200,http://localhost:8081}
webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
webauthn.rp-name=BeastX Gym
webauthn.origins=${WEBAUTHN_ORIGINS:http://localhost:4200,http://localhost:8081}
checkin.kiosk.token-seconds=${QR_EXPIRATION_SECONDS:60}
checkin.fingerprint.simulator-enabled=${SIMULATOR_ENABLED:false}

# Cross-Device QR & Biometric Check-in Policy
checkin.policy.qr-expiration-seconds=${QR_EXPIRATION_SECONDS:60}
checkin.policy.challenge-expiration-seconds=${WEBAUTHN_CHALLENGE_SECONDS:120}
checkin.policy.registration-challenge-seconds=${WEBAUTHN_REG_CHALLENGE_SECONDS:180}
checkin.policy.clock-skew-seconds=${CHECKIN_CLOCK_SKEW_SECONDS:10}
checkin.policy.max-devices-per-member=${CHECKIN_MAX_DEVICES:5}
checkin.policy.allow-reentry-after-checkout=${ALLOW_REENTRY_AFTER_CHECKOUT:true}
checkin.policy.location-policy=${CHECKIN_LOCATION_POLICY:OFF}
checkin.policy.reject-on-location-denied=${CHECKIN_REJECT_LOCATION_DENIED:false}
checkin.policy.branch-lat=${BRANCH_LAT:}
checkin.policy.branch-lng=${BRANCH_LNG:}
checkin.policy.max-distance-meters=${BRANCH_MAX_DISTANCE_METERS:250}
checkin.policy.allowed-ip-prefixes=${BRANCH_ALLOWED_IP_PREFIXES:}
checkin.policy.otp-fallback-enabled=${CHECKIN_OTP_FALLBACK:false}
checkin.policy.allow-admin-manual-fallback=true
checkin.policy.default-gym-id=${DEFAULT_GYM_ID:BEASTX-01}
checkin.policy.default-branch-id=${DEFAULT_BRANCH_ID:MAIN}
checkin.policy.session-rate-limit-per-minute=25
checkin.policy.verify-failure-rate-limit-per-minute=10

# Secure Cookie Settings (when session/csrf cookies are issued)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Actuator Health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Don't test Gmail in the health check (Render free plan blocks SMTP ports)
management.health.mail.enabled=false

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Give up after 5 seconds instead of hanging for ~2 minutes
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+919657379053}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# Google Sheets automation
automation.sheets.enabled=true
automation.sheets.spreadsheet-id=${SHEETS_SPREADSHEET_ID:}
automation.sheets.credentials-file=${GOOGLE_CREDENTIALS_PATH:google-credentials.json}
automation.sheets.resync-cron=0 0 23 * * *

# Automation & App Settings
automation.brand-name=BeastX Gym
automation.whatsapp.enabled=true
# true locally; set AUTOMATION_EMAIL_ENABLED=false on Render
automation.email.enabled=${AUTOMATION_EMAIL_ENABLED:true}
automation.reminder.days-before=2
automation.reminder.cron=0 0 9 * * *
automation.report.admin-emails=${ADMIN_EMAILS:}
automation.report.admin-phone=${ADMIN_PHONE:}
automation.report.cron=0 0 8 * * *
app.timezone=Asia/Kolkata

spring.datasource.hikari.max-lifetime=300000